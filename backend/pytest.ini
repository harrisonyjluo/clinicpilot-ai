[pytest]
testpaths = tests
pythonpath = .
addopts = -q -m "not live and not model and not e2e"
asyncio_mode = auto
markers =
    live: requires a real ANTHROPIC_API_KEY and network access
    model: requires the real local embedding model (RUN_MODEL_TESTS=1)
    e2e: live end-to-end tests against a running backend (RUN_E2E_TESTS=1)
