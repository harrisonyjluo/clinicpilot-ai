services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/clinicpilot.db
      BACKEND_BASE_URL: http://127.0.0.1:8000
      RAG_INDEX_DIR: /app/data/rag
      RAG_EMBEDDING_CACHE_DIR: /app/data/fastembed
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - clinicpilot-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_PATIENT_ID: ${VITE_PATIENT_ID:-P001}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  clinicpilot-data:
